name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Create index.html
        run: |
          cat > dist/client/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Rentzyy - Make PG Management Effortless</title>
              <script>window.__BASE__ = '/rentzyy-narrative/';</script>
            </head>
            <body>
              <div id="root"></div>
              <link rel="stylesheet" href="/rentzyy-narrative/assets/styles-D11KhREe.css">
              <script type="module" src="/rentzyy-narrative/assets/index-CmbhMfq6.js"></script>
              <script type="module" src="/rentzyy-narrative/assets/index-CSDmQibY.js"></script>
            </body>
          </html>
          EOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
